name: Validate usage snapshot

# Intended Amsterdam windows: 09:00 and 16:00 Europe/Amsterdam.
# GitHub cron is UTC-only and does not follow DST. See docs/SCHEDULE.md.
#
# Both CET and CEST UTC candidates are scheduled; scripts/amsterdam-gate.js
# selects the run that lands near 09:00 or 16:00 local and skips the rest.
#
#   09:00 Amsterdam → 08:00 UTC (CET) or 07:00 UTC (CEST)
#   16:00 Amsterdam → 15:00 UTC (CET) or 14:00 UTC (CEST)
#
# IMPORTANT: GitHub-hosted runners cannot inspect locally authenticated
# desktop or browser apps (Cursor, Claude, Enrich Labs dashboards, etc.).
# Scheduled collect must never claim those measurements. Real usage figures
# require a local `npm run collect` with optional data/local-overrides.json.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate committed public snapshot
        run: npm run check
