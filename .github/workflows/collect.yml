name: Validate usage snapshot

# Validates the committed public snapshot only.
# Hosted runners cannot measure authenticated desktop/browser usage
# (Cursor, Codex, Claude OAuth, Enrich Labs) or prepaid keys that live in
# ~/.config/ai-usage-dashboard/env (OpenRouter, Sail Research).
# Live meters run on the Mac LaunchAgent — see docs/SCHEDULE.md and PLAN.md.
#
# Do not reintroduce a scheduled collect-as-meter job here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate committed public snapshot
        run: npm run check
