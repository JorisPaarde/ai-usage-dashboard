name: Deploy GitHub Pages

# Hosts the committed public snapshot only.
# Never runs `npm run collect` — hosted runners cannot measure authenticated
# desktop usage. Live meters are published by the Mac LaunchAgent pushing
# data/latest.json to main. See docs/SCHEDULE.md and PLAN.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Guard — Pages must never collect meters
        run: node scripts/assert-no-hosted-meter.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
