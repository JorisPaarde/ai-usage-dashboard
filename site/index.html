<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Usage Dashboard</title>
    <meta
      name="description"
      content="Calm multi-source AI usage overview. Public-safe metrics only."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <p class="brand">AI Usage</p>
      <h1>Quota at a glance</h1>
      <p class="lede">
        OpenAI/Buzz, Cursor Agent, Claude Code, Ollama, and Enrich Labs —
        measured when possible, Unknown when not.
      </p>
      <p class="meta-line" id="snapshot-meta">Loading snapshot…</p>
    </header>

    <main id="dashboard" class="dashboard" aria-live="polite"></main>

    <footer class="site-footer">
      <p>
        No credentials, emails, prompts, or customer data are stored in this
        page. Schedule notes live in the repository at docs/SCHEDULE.md.
      </p>
      <p id="build-meta"></p>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
